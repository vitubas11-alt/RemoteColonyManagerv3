
name: Extrair projeto ZIP

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extrair projeto
        run: |
          python - <<'PY'
          import pathlib
          import zipfile
          import tempfile
          import shutil

          repo = pathlib.Path(".").resolve()
          zips = list(repo.glob("RemoteColonyManager_0.3.1_codigo_atualizado.zip"))

          if len(zips) != 1:
              raise Exception("ZIP do projeto não encontrado na raiz.")

          with tempfile.TemporaryDirectory() as temp:
              temp = pathlib.Path(temp)

              with zipfile.ZipFile(zips[0]) as archive:
                  for item in archive.infolist():
                      path = pathlib.PurePosixPath(item.filename)
                      if path.is_absolute() or ".." in path.parts:
                          raise Exception("Caminho inseguro no ZIP.")
                      target = temp.joinpath(*path.parts)
                      if item.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(archive.read(item))

              projects = list(temp.rglob("build.gradle"))
              if not projects:
                  raise Exception("Não encontrei build.gradle no ZIP.")

              root = min((p.parent for p in projects),
                         key=lambda p: len(p.parts))

              def copy_item(src, dst):
                  if src.is_dir():
                      dst.mkdir(parents=True, exist_ok=True)
                      for child in src.iterdir():
                          copy_item(child, dst / child.name)
                  else:
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(src, dst)

              for item in root.iterdir():
                  if item.name != ".git":
                      copy_item(item, repo / item.name)

          print("Projeto extraído.")
          PY

      - name: Salvar arquivos na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Importar projeto Remote Colony Manager"
          git push
