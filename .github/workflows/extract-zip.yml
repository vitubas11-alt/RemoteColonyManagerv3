name: Publicar Remote Colony Manager

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/extract-zip.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar branch v3
        uses: actions/checkout@v4
        with:
          ref: v3
          path: projeto
          fetch-depth: 0

      - name: Extrair arquivos
        working-directory: projeto
        run: |
          ZIP="RemoteColonyManager_0.3.1_codigo_atualizado.zip"

          test -f "$ZIP" || exit 1

          mkdir ../extraido
          unzip -o "$ZIP" -d ../extraido

          BUILD=$(find ../extraido -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print -quit)

          if [ -z "$BUILD" ]; then
            echo "Projeto Gradle não encontrado no ZIP"
            exit 1
          fi

          ROOT=$(dirname "$BUILD")

          cp -a "$ROOT"/. .
          rm -rf ../extraido
          rm "$ZIP"

      - name: Publicar arquivos na v3
        working-directory: projeto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar Remote Colony Manager 0.3.1" || exit 0
          git push origin HEAD:v3
