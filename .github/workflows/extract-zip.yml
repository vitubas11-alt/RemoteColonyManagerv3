name: Extrair projeto Remote Colony Manager

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar branch v3
        uses: actions/checkout@v4
        with:
          ref: v3
          fetch-depth: 0

      - name: Extrair projeto
        run: |
          ZIP="RemoteColonyManager_0.3.1_codigo_atualizado.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP não encontrado!"
            exit 1
          fi

          mkdir extracao
          unzip -o "$ZIP" -d extracao

          cp -a extracao/. .
          rm -rf extracao
          rm "$ZIP"

      - name: Salvar na branch v3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Atualizar Remote Colony Manager 0.3.1"
            git push origin HEAD:v3
          fi
