
name: Compilar Remote Colony Manager

on:
  workflow_dispatch:
  push:
    branches:
      - v3
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/**'
      - 'src/**'
      - '.github/workflows/build-mod.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          ref: v3

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar mod
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: Remote-Colony-Manager-0.3.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
