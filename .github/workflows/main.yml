name: Extrair projeto Remote Colony Manager

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Baixar ZIP da branch v3
        uses: actions/checkout@v4
        with:
          ref: v3
          path: projeto

      - name: Extrair projeto
        run: |
          python - <<'PY'
          import pathlib
          import zipfile
          import shutil
          import tempfile

          repo = pathlib.Path("projeto")
          zips = list(repo.glob("RemoteColonyManager_0.3.1_codigo_atualizado.zip"))

          if len(zips) != 1:
              raise Exception("ZIP não encontrado na branch v3.")

          with tempfile.TemporaryDirectory() as temp:
              temp = pathlib.Path(temp)

              with zipfile.ZipFile(zips[0]) as archive:
                  for item in archive.infolist():
                      path = pathlib.PurePosixPath(item.filename)

                      if path.is_absolute() or ".." in path.parts:
                          raise Exception("Caminho inválido no ZIP.")

                      target = temp.joinpath(*path.parts)

                      if item.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(archive.read(item))

              projects = list(temp.rglob("build.gradle"))

              if not projects:
                  raise Exception("build.gradle não encontrado.")

              root = min(
                  (p.parent for p in projects),
                  key=lambda p: len(p.parts)
              )

              for item in root.iterdir():
                  if item.name not in [".git", ".github"]:
                      destination = repo / item.name

                      if item.is_dir():
                          if destination.exists():
                              shutil.rmtree(destination)
                          shutil.copytree(item, destination)
                      else:
                          shutil.copy2(item, destination)

          print("Projeto extraído com sucesso!")
          PY

      - name: Salvar projeto na branch v3
        run: |
          cd projeto
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extrair projeto completo"
          git push origin HEAD:v3
