plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.vitor'
version = '0.3.1'

base {
    archivesName = 'remotecolonymanager'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://ldtteam.jfrog.io/artifactory/maven/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    implementation fg.deobf('curse.maven:minecolonies-245506:9511851')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'remotecolonymanager',
            'Specification-Vendor': 'vitor',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'vitor'
        ])
    }
}
